<!DOCTYPE html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ site.title | escape }} | {{ site.affiliation | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="keywords" content="{{ site.keywords | escape }}">
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <link rel="preload" href="{{ '/assets/fonts/newsreader-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/navigation.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <!-- Buttons keep GitHub as the only page link. -->
      <nav class="section-nav" aria-label="Page sections" hidden>
        <button type="button" data-scroll-target="about">About</button>
        <button type="button" data-scroll-target="education">Education</button>
        <button type="button" data-scroll-target="publications">Publications</button>
        <button type="button" data-scroll-target="experience">Experience</button>
      </nav>

      <header class="hero" id="about" tabindex="-1" aria-labelledby="profile-name">
        <h1 id="profile-name">
          <span>{{ site.title | escape }}</span>
          <span class="chinese-name" lang="zh-Hans">{{ site.chinese_name | escape }}</span>
        </h1>
        <p class="hero-subtitle">{{ site.position | escape }} <span aria-hidden="true">&middot;</span> {{ site.affiliation | escape }}</p>
        <div class="hero-contact">
          <a class="github-profile" href="{{ site.github_link | escape }}" aria-label="GitHub profile of {{ site.title | escape }}">GitHub</a>
          <span class="contact-separator" aria-hidden="true">&middot;</span>
          <span class="profile-email">{{ site.email | escape }}</span>
        </div>
      </header>

      <main id="main-content" class="content">
        {{ content }}
      </main>
      <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}</p>
      </footer>
    </div>
  </body>
</html>
